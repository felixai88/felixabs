<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14232b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Absensi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f3;--sf:#fff;--ink:#14232b;--mu:#5b6b74;--ln:#d3dde2;--ok:#0b7a6b;--okb:#d7f0ea;--bad:#b3402a;--badb:#f8e0da}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a20;--sf:#17252d;--ink:#e6eef2;--mu:#93a5af;--ln:#2a3c46;--ok:#4cc9b0;--okb:#14403a;--bad:#f08a72;--badb:#45231b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.25rem;margin:0}h2{font-size:1rem;margin:18px 0 8px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mu{color:var(--mu);font-size:.85rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;font-size:.82rem;margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--ln);border-radius:9px;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.b{width:100%;border:0;border-radius:12px;padding:15px;font-weight:800;background:var(--ok);color:#fff;margin-top:12px}
.b:disabled{background:var(--ln);color:var(--mu);cursor:not-allowed}
.b2{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:9px;padding:8px 12px;font-weight:600;font-size:.85rem}
.b3{border:0;background:none;color:var(--bad);font-weight:600;font-size:.85rem}
nav{display:flex;gap:4px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 10px;border-radius:9px;font-weight:600;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.st{border-radius:14px;padding:14px 16px;font-weight:600;margin-bottom:12px;background:var(--sf);border:1px solid var(--ln)}
.st small{display:block;font-weight:400}.st.ok{background:var(--okb);color:var(--ok);border:0}.st.bad{background:var(--badb);color:var(--bad);border:0}
.dist{font-size:2.3rem;font-weight:800;line-height:1.1}
#map{height:240px;border-radius:12px;margin:12px 0;border:1px solid var(--ln)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);font-size:.9rem}li:last-child{border:0}
li span{display:block;color:var(--mu);font-size:.8rem}
.in{color:var(--ok);font-weight:800}.out{color:var(--bad);font-weight:800}
.row{display:flex;gap:8px}.row>*{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:9}
.modal video,.modal img{max-width:100%;max-height:68vh;border-radius:12px;background:#000}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:20;max-width:90%}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<!-- LOGIN -->
<section id="v-login" hidden>
  <img src="logo.png" alt="Logo" width="88" height="88" style="display:block;margin-top:32px"><h1 style="margin-top:10px">Absensi</h1>
  <p class="mu">Masuk dengan NIK dan password Anda.</p>
  <div class="card">
    <label for="nik">NIK</label><input id="nik" inputmode="numeric" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="b" id="bLogin">Masuk</button>
  </div>
</section>

<!-- APP -->
<section id="v-app" hidden>
  <header><img src="logo.png" alt="" width="40" height="40" style="margin-right:10px"><div style="flex:1"><h1 id="hNama">Absensi</h1><div class="mu" id="hPeran"></div></div><button class="b2" id="bOut">Keluar</button></header>
  <nav id="nav"></nav>

  <div id="p-absen">
    <div id="st" class="st">Mencari lokasi Anda…</div>
    <div class="card">
      <div class="mu">Jarak ke titik kantor terdekat</div>
      <div class="dist" id="dist">–</div><div class="mu" id="near"></div>
      <div id="map"></div>
      <button class="b" id="bAbsen" disabled>Absen</button>
    </div>
    <h2>Riwayat terakhir</h2><div class="card"><ul id="riw"></ul></div>
  </div>

  <div id="p-rekap" hidden>
    <div class="card"><div class="row">
      <div><label for="d1">Dari</label><input id="d1" type="date"></div>
      <div><label for="d2">Sampai</label><input id="d2" type="date"></div></div>
      <button class="b" id="bRekap">Tampilkan rekap</button></div>
    <div class="card"><ul id="rekap"><li class="mu">Pilih tanggal lalu tampilkan rekap.</li></ul></div>
  </div>

  <div id="p-kary" hidden>
    <div class="card"><b>Tambah karyawan</b>
      <label for="kn">NIK</label><input id="kn" inputmode="numeric">
      <label for="kna">Nama</label><input id="kna">
      <label for="kp">Password awal (min. 8 karakter)</label><input id="kp" type="password">
      <div class="row"><div><label for="kr">Peran</label><select id="kr"><option>karyawan</option><option>admin</option></select></div>
      <div><label for="kt">Titik absen</label><select id="kt"></select></div></div>
      <button class="b" id="bKary">Simpan karyawan</button></div>
    <div class="card"><ul id="kl"></ul></div>
  </div>

  <div id="p-titik" hidden>
    <div class="card"><b>Tambah titik kantor</b>
      <label for="tn">Nama lokasi</label><input id="tn">
      <div class="row"><div><label for="tla">Latitude</label><input id="tla" inputmode="decimal"></div>
      <div><label for="tlo">Longitude</label><input id="tlo" inputmode="decimal"></div></div>
      <label for="tr">Radius (meter)</label><input id="tr" inputmode="numeric" value="100">
      <button class="b2" id="bHere" style="margin-top:10px">Pakai lokasi saya sekarang</button>
      <button class="b" id="bTitik">Simpan titik</button></div>
    <div class="card"><ul id="tl"></ul></div>
  </div>
</section>
</main>

<div id="cam" class="modal" hidden><video id="vid" autoplay playsinline muted></video>
  <div class="row" style="max-width:360px;width:100%"><button class="b2" id="bBatal">Batal</button><button class="b" id="bSnap" style="margin:0">Ambil foto dan absen</button></div></div>
<div id="pic" class="modal" hidden><img id="img" alt="Foto absen"><button class="b2" id="bTutup">Tutup</button></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var API="https://script.google.com/macros/s/AKfycbz-4fpak0c1NsYpHJap5x461TofaO-CkP3STYCUXAUEr7Oiu-G2w34Rhf5BmexDdXn3JQ/exec";
var $=function(i){return document.getElementById(i)};
var S={token:"",user:null,titik:[],pos:null,maxAcc:100,map:null,grp:null,me:null,fit:false,stream:null,wid:null};
try{S.token=localStorage.getItem("t")||"";S.user=JSON.parse(localStorage.getItem("u")||"null")}catch(e){}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},4500)}
function call(aksi,d){d=d||{};d.aksi=aksi;d.token=S.token;
  return fetch(API,{method:"POST",body:JSON.stringify(d)}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok){if(/Sesi|login ulang|tidak aktif/.test(j.error))logout(true);throw new Error(j.error)}return j})}
function fail(e){toast(e.message==="Failed to fetch"?"Tidak bisa terhubung ke server. Periksa internet Anda.":e.message)}
function hav(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h))}
function fm(m){return m>=1000?(m/1000).toFixed(1)+" km":Math.round(m)+" m"}

/* ---- login ---- */
$("bLogin").onclick=function(){var b=this;b.disabled=true;b.textContent="Memeriksa…";
  call("login",{nik:$("nik").value.trim(),password:$("pw").value}).then(function(j){
    S.token=j.token;S.user=j.user;try{localStorage.setItem("t",j.token);localStorage.setItem("u",JSON.stringify(j.user))}catch(e){}
    $("pw").value="";start()}).catch(fail).then(function(){b.disabled=false;b.textContent="Masuk"})};
$("pw").onkeydown=function(e){if(e.key==="Enter")$("bLogin").click()};
function logout(auto){S.token="";S.user=null;try{localStorage.removeItem("t");localStorage.removeItem("u")}catch(e){}
  if(S.wid!=null)navigator.geolocation.clearWatch(S.wid);S.wid=null;S.pos=null;
  $("v-app").hidden=true;$("v-login").hidden=false;if(auto)toast("Sesi berakhir. Silakan login ulang.")}
$("bOut").onclick=function(){logout(false)};

/* ---- start ---- */
function start(){
  $("v-login").hidden=true;$("v-app").hidden=false;
  $("hNama").textContent=S.user.nama;$("hPeran").textContent=(S.user.peran==="admin"?"Admin":"Karyawan")+" · NIK "+S.user.nik+" · v4";
  var tabs=[["absen","Absen"]];if(S.user.peran==="admin")tabs.push(["rekap","Rekap"],["kary","Karyawan"],["titik","Titik kantor"]);
  $("nav").innerHTML="";tabs.forEach(function(t){var b=document.createElement("button");b.textContent=t[1];b.dataset.k=t[0];b.onclick=function(){tab(t[0])};$("nav").appendChild(b)});
  $("nav").hidden=tabs.length<2;tab("absen");
  call("titik").then(function(j){S.titik=j.titik;var m=Number(j.maxAkurasi);S.maxAcc=m>=50?m:100;drawMap();render()}).catch(fail);
  riwayat();watch();
}
function tab(k){["absen","rekap","kary","titik"].forEach(function(x){$("p-"+x).hidden=x!==k});
  Array.prototype.forEach.call($("nav").children,function(b){b.className=b.dataset.k===k?"on":""});
  if(k==="absen"&&S.map)setTimeout(function(){S.map.invalidateSize()},50);
  if(k==="kary")listKary();if(k==="titik")listTitik()}

/* ---- lokasi dan peta ---- */
function watch(){
  if(!navigator.geolocation){$("st").className="st bad";$("st").textContent="Browser tidak mendukung lokasi.";return}
  if(S.wid!=null)return;
  S.wid=navigator.geolocation.watchPosition(function(p){S.pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};render()},
    function(e){$("st").className="st bad";$("st").innerHTML=e.code===1?"Akses lokasi ditolak<small>Izinkan lokasi untuk situs ini di pengaturan browser, lalu muat ulang.</small>":"Lokasi belum tersedia<small>Aktifkan GPS lalu coba lagi.</small>"},
    {enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
function drawMap(){
  if(!S.map){S.map=L.map("map",{zoomControl:true}).setView([3.5952,98.6722],15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(S.map);S.grp=L.layerGroup().addTo(S.map)}
  S.grp.clearLayers();S.titik.forEach(function(t){L.circle([t.lat,t.lng],{radius:t.radius,color:"#0b7a6b",fillOpacity:.15}).bindTooltip(t.nama).addTo(S.grp)});
  if(S.titik.length&&!S.pos)S.map.setView([S.titik[0].lat,S.titik[0].lng],16)}
function render(){
  var st=$("st"),btn=$("bAbsen");
  if(S.pos&&S.map){if(!S.me)S.me=L.circleMarker([S.pos.lat,S.pos.lng],{radius:8,color:"#fff",weight:2,fillColor:"#2563eb",fillOpacity:1}).addTo(S.map);else S.me.setLatLng([S.pos.lat,S.pos.lng]);
    if(!S.fit){S.fit=true;var pts=[[S.pos.lat,S.pos.lng]].concat(S.titik.map(function(t){return[t.lat,t.lng]}));S.map.fitBounds(pts,{padding:[30,30],maxZoom:17})}}
  if(!S.titik.length){btn.disabled=true;return}
  if(!S.pos){btn.disabled=true;return}
  var n=null;S.titik.forEach(function(t){var d=hav(S.pos.lat,S.pos.lng,t.lat,t.lng);if(!n||d<n.d)n={t:t,d:d}});
  $("dist").textContent=fm(n.d);$("near").textContent=n.t.nama+" · radius "+n.t.radius+" m · akurasi GPS ±"+Math.round(S.pos.acc)+" m (batas ±"+S.maxAcc+" m)";
  var inside=n.d<=n.t.radius,acc=S.pos.acc<=S.maxAcc;
  if(!acc){st.className="st bad";st.innerHTML="Sinyal GPS kurang akurat<small>Pindah ke area terbuka dan tunggu beberapa detik.</small>"}
  else if(inside){st.className="st ok";st.innerHTML="Anda berada di area "+esc(n.t.nama)+"<small>Absen sudah bisa dilakukan.</small>"}
  else{st.className="st bad";st.innerHTML="Anda di luar area absen<small>Dekati "+esc(n.t.nama)+" sejauh "+fm(n.d-n.t.radius)+" lagi.</small>"}
  btn.disabled=!(inside&&acc)}

/* ---- absen dengan selfie ---- */
$("bAbsen").onclick=function(){
  if(!navigator.mediaDevices){toast("Kamera tidak tersedia. Buka lewat HTTPS.");return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640}},audio:false}).then(function(s){
    S.stream=s;$("vid").srcObject=s;$("cam").hidden=false}).catch(function(){toast("Izin kamera diperlukan untuk absen.")})};
function stopCam(){if(S.stream){S.stream.getTracks().forEach(function(t){t.stop()});S.stream=null}$("cam").hidden=true}
$("bBatal").onclick=stopCam;
$("bSnap").onclick=function(){
  var v=$("vid");if(!v.videoWidth){toast("Kamera belum siap.");return}
  var w=480,h=Math.round(v.videoHeight*w/v.videoWidth),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(v,0,0,w,h);
  var foto=c.toDataURL("image/jpeg",.7);stopCam();toast("Mengirim absen…");
  navigator.geolocation.getCurrentPosition(function(p){
    call("absen",{lat:p.coords.latitude,lng:p.coords.longitude,akurasi:p.coords.accuracy,foto:foto,perangkat:navigator.userAgent}).then(function(j){
      toast("Absen "+j.jenis.toLowerCase()+" tercatat: "+j.waktu+" WIB");riwayat()}).catch(fail)},
    function(){toast("Lokasi tidak bisa diambil. Coba lagi.")},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};
function riwayat(){call("riwayatSaya").then(function(j){var u=$("riw");u.innerHTML=j.riwayat.length?"":'<li class="mu">Belum ada absen.</li>';
  j.riwayat.forEach(function(r){u.insertAdjacentHTML("beforeend","<li><div><b class='"+(r.jenis==="Masuk"?"in":"out")+"'>"+esc(r.jenis)+"</b><span>"+esc(r.waktu)+" WIB</span></div><span>"+esc(r.jarak)+" m dari titik</span></li>")})}).catch(function(){})}

/* ---- admin: rekap ---- */
var today=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Jakarta"});$("d1").value=today;$("d2").value=today;
$("bRekap").onclick=function(){call("rekapAbsensi",{dari:$("d1").value,sampai:$("d2").value}).then(function(j){var u=$("rekap");u.innerHTML=j.data.length?"":'<li class="mu">Tidak ada absen pada tanggal ini.</li>';
  j.data.forEach(function(r){u.insertAdjacentHTML("beforeend","<li><div><b>"+esc(r.nama)+"</b> <span class='"+(r.jenis==="Masuk"?"in":"out")+"' style='display:inline'>"+esc(r.jenis)+"</span><span>"+esc(r.waktu)+" WIB · "+esc(r.jarak)+" m · <a href='https://www.google.com/maps?q="+esc(r.lat)+","+esc(r.lng)+"' target='_blank' rel='noopener'>peta</a></span></div><button class='b2' data-u='"+esc(r.foto)+"'>Foto</button></li>")});
  Array.prototype.forEach.call(u.querySelectorAll("button[data-u]"),function(b){b.onclick=function(){b.textContent="…";call("ambilFoto",{url:b.dataset.u}).then(function(j){$("img").src=j.gambar;$("pic").hidden=false}).catch(fail).then(function(){b.textContent="Foto"})}})}).catch(fail)};
$("bTutup").onclick=function(){$("pic").hidden=true};

/* ---- admin: karyawan ---- */
function listKary(){call("titik").then(function(j){$("kt").innerHTML='<option value="SEMUA">Semua titik</option>'+j.titik.map(function(t){return'<option value="'+esc(t.id)+'">'+esc(t.nama)+"</option>"}).join("")}).catch(function(){});
  call("daftarKaryawan").then(function(j){var u=$("kl");u.innerHTML="";j.karyawan.forEach(function(k){
    var li=document.createElement("li");li.innerHTML="<div><b>"+esc(k.nama)+"</b><span>"+esc(k.nik)+" · "+esc(k.peran)+" · "+esc(k.titik)+" · "+(String(k.aktif).toUpperCase()==="YA"?"aktif":"nonaktif")+"</span></div>";
    var r=document.createElement("button");r.className="b2";r.textContent="Reset";r.onclick=function(){var p=prompt("Password baru untuk "+k.nama+" (min. 8 karakter):");if(p)call("resetPassword",{nik:k.nik,baru:p}).then(function(){toast("Password diganti.")}).catch(fail)};
    var a=document.createElement("button");a.className="b3";var on=String(k.aktif).toUpperCase()==="YA";a.textContent=on?"Nonaktifkan":"Aktifkan";a.onclick=function(){call("setAktif",{nik:k.nik,aktif:!on}).then(listKary).catch(fail)};
    var d=document.createElement("div");d.appendChild(r);d.appendChild(a);li.appendChild(d);u.appendChild(li)})}).catch(fail)}
$("bKary").onclick=function(){call("tambahKaryawan",{nik:$("kn").value.trim(),nama:$("kna").value.trim(),password:$("kp").value,peran:$("kr").value,titik:$("kt").value}).then(function(){
  toast("Karyawan disimpan.");$("kn").value=$("kna").value=$("kp").value="";listKary()}).catch(fail)};

/* ---- admin: titik ---- */
function listTitik(){call("titik").then(function(j){S.titik=j.titik;drawMap();$("tl").innerHTML=j.titik.map(function(t){return"<li><div><b>"+esc(t.nama)+"</b><span>"+esc(t.id)+" · "+t.lat.toFixed(5)+", "+t.lng.toFixed(5)+" · radius "+t.radius+" m</span></div></li>"}).join("")||'<li class="mu">Belum ada titik.</li>'}).catch(fail)}
$("bHere").onclick=function(){navigator.geolocation.getCurrentPosition(function(p){$("tla").value=p.coords.latitude.toFixed(6);$("tlo").value=p.coords.longitude.toFixed(6);toast("Koordinat terisi (±"+Math.round(p.coords.accuracy)+" m).")},function(){toast("Lokasi tidak bisa diambil.")},{enableHighAccuracy:true,timeout:15000})};
$("bTitik").onclick=function(){call("tambahTitik",{nama:$("tn").value.trim(),lat:$("tla").value.replace(",","."),lng:$("tlo").value.replace(",","."),radius:$("tr").value}).then(function(){
  toast("Titik disimpan.");$("tn").value=$("tla").value=$("tlo").value="";listTitik()}).catch(fail)};

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
if(S.token&&S.user)start();else $("v-login").hidden=false;
</script>
</body>
</html>
